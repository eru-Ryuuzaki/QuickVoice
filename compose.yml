services:
  quickvoice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: http://host.docker.internal:7890
        HTTPS_PROXY: http://host.docker.internal:7890
        http_proxy: http://host.docker.internal:7890
        https_proxy: http://host.docker.internal:7890
    image: quickvoice:local
    container_name: quickvoice
    restart: unless-stopped
    ports:
      - "14003:4003"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4003
      HOSTNAME: 0.0.0.0
      TZ: Asia/Shanghai
      http_proxy: http://host.docker.internal:7890
      https_proxy: http://host.docker.internal:7890
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4003/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
